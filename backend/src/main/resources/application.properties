
spring.application.name=ecommerce

# ==============================
# Base de données
# ==============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# ==============================
# Sécurité
# ==============================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================
# CORS
# ==============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# ==============================
# Stripe
# ==============================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/commande/succes}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/panier}

# ==============================
# Fournisseurs
# ==============================
fragella.api-key=${FRAGELLA_API_KEY:}
fragella.base-url=${FRAGELLA_BASE_URL:https://api.fragella.com/api/v1/fragrances}

# Synchronisation automatique des fournisseurs
app.suppliers.sync.enabled=${SUPPLIER_SYNC_ENABLED:false}
app.suppliers.sync.cron=${SUPPLIER_SYNC_CRON:0 0 3 * * *}

# Marge par défaut des produits importés (en pourcentage)
app.suppliers.default-markup-percent=${SUPPLIER_MARKUP_PERCENT:0}

# ==============================
# Informations légales du vendeur
# ==============================
app.company.name=${COMPANY_NAME:SIDRA}
app.company.legal-form=${COMPANY_LEGAL_FORM:Entrepreneur individuel}
app.company.address=${COMPANY_ADDRESS:}
app.company.postal-code=${COMPANY_POSTAL_CODE:}
app.company.city=${COMPANY_CITY:}
app.company.country=${COMPANY_COUNTRY:France}
app.company.siret=${COMPANY_SIRET:}
app.company.vat-number=${COMPANY_VAT_NUMBER:}
app.company.email=${COMPANY_EMAIL:contact@sidra-market.com}

# ==============================
# Facturation
# ==============================
app.invoice.prefix=${INVOICE_PREFIX:SIDRA}

# ==============================
# Email - OVHcloud Zimbra Starter
# ==============================
# SMTP OVHcloud : SSL/TLS sur le port 465
spring.mail.host=${MAIL_HOST:smtp.mail.ovh.net}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:contact@sidra-market.com}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# Délais de connexion SMTP (millisecondes)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ==============================
# Configuration applicative des emails
# ==============================
# true = envoi réel des emails
app.mail.enabled=${MAIL_ENABLED:true}

# L'adresse doit correspondre au compte SMTP authentifié
app.mail.from=${MAIL_FROM:contact@sidra-market.com}
app.mail.from-name=${MAIL_FROM_NAME:SIDRA}

# URL publique du frontend en production
# En local, le frontend utilise le port 5173
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Adresse qui reçoit les notifications administrateur
app.mail.admin=${MAIL_ADMIN:}

# URL du panneau d'administration
app.admin-url=${ADMIN_URL:http://localhost:5174}

# ==============================
# Stock
# ==============================
app.stock.low-threshold=${STOCK_LOW_THRESHOLD:5}

# ==============================
# Stockage des images
# ==============================
app.images.storage=${IMAGE_STORAGE:local}
app.images.local-dir=${IMAGE_LOCAL_DIR:./uploads}
app.images.max-size-mb=${IMAGE_MAX_SIZE_MB:5}
app.images.max-dimension=${IMAGE_MAX_DIMENSION:1600}

# ==============================
# Limites d'envoi de fichiers
# ==============================
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=30MB
