spring.application.name=ecommerce

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce

spring.datasource.username=postgres

spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

spring.jpa.defer-datasource-initialization=false

# Fragella API
fragella.api.base-url=https://api.fragella.com/api/v1
fragella.api.key=${FRAGELLA_API_KEY}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/commande/succes}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/cart}