spring.application.name=ecommerce

# Base de données
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Sécurité
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/commande/succes}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/cart}

# Fournisseurs
fragella.api-key=${FRAGELLA_API_KEY:}

# Informations légales du vendeur (obligatoires sur facture)
app.company.name=${COMPANY_NAME:SHAHIN}
app.company.legal-form=${COMPANY_LEGAL_FORM:Entrepreneur individuel}
app.company.address=${COMPANY_ADDRESS:}
app.company.postal-code=${COMPANY_POSTAL_CODE:}
app.company.city=${COMPANY_CITY:}
app.company.country=${COMPANY_COUNTRY:France}
app.company.siret=${COMPANY_SIRET:}
app.company.vat-number=${COMPANY_VAT_NUMBER:}
app.company.email=${COMPANY_EMAIL:contact@shahin.fr}

# Facturation
app.invoice.prefix=${INVOICE_PREFIX:SHAHIN}

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# false = les emails ne partent pas, leur contenu s'affiche dans la console
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@sidra.fr}
app.mail.from-name=${MAIL_FROM_NAME:SIDRA}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Synchronisation automatique des fournisseurs (désactivée par défaut)
app.suppliers.sync.enabled=${SUPPLIER_SYNC_ENABLED:false}
app.suppliers.sync.cron=${SUPPLIER_SYNC_CRON:0 0 3 * * *}
fragella.base-url=${FRAGELLA_BASE_URL:https://api.fragella.com/api/v1/fragrances}

app.mail.admin=${MAIL_ADMIN:}
app.admin-url=${ADMIN_URL:http://localhost:5174}
# Seuil d'alerte de stock par défaut
app.stock.low-threshold=${STOCK_LOW_THRESHOLD:5}