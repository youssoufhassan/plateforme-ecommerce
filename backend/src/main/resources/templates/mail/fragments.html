<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="header">
      <table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="background: #111111"
      >
        <tr>
          <td style="padding: 24px; text-align: center">
            <span
              style="
                color: #ffffff;
                font-size: 22px;
                font-weight: bold;
                letter-spacing: 2px;
              "
              >SHAHIN</span
            >
          </td>
        </tr>
      </table>
    </div>

    <div th:fragment="footer">
      <table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="border-top: 1px solid #eeeeee"
      >
        <tr>
          <td
            style="
              padding: 18px 28px;
              text-align: center;
              color: #999999;
              font-size: 11px;
            "
          >
            SHAHIN — Parfums et produits venus d'ailleurs<br />
            Cet email vous est envoyé suite à votre commande.
          </td>
        </tr>
      </table>
    </div>

    <div th:fragment="items">
      <table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        style="margin: 20px 0; border-collapse: collapse"
      >
        <tr th:each="item : ${items}" style="border-bottom: 1px solid #eeeeee">
          <td style="padding: 10px 0; color: #333333; font-size: 14px">
            <span th:text="${item.quantity}">1</span> ×
            <span th:text="${item.name}">Produit</span>
          </td>
          <td
            align="right"
            style="padding: 10px 0; color: #333333; font-size: 14px"
            th:text="${item.total}"
          >
            0,00 €
          </td>
        </tr>
        <tr>
          <td style="padding: 8px 0; color: #666666; font-size: 13px">
            Livraison
          </td>
          <td
            align="right"
            style="padding: 8px 0; color: #666666; font-size: 13px"
            th:text="${shipping}"
          >
            0,00 €
          </td>
        </tr>
        <tr>
          <td
            style="
              padding: 12px 0;
              font-weight: bold;
              font-size: 16px;
              border-top: 1.5px solid #222222;
            "
          >
            Total
          </td>
          <td
            align="right"
            style="
              padding: 12px 0;
              font-weight: bold;
              font-size: 16px;
              border-top: 1.5px solid #222222;
            "
            th:text="${total}"
          >
            0,00 €
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
