<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f6f6f8;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 560px;
              background: #ffffff;
              border-radius: 8px;
              overflow: hidden;
            "
          >
            <tr>
              <td th:replace="~{mail/fragments :: header}"></td>
            </tr>
            <tr>
              <td style="padding: 32px 28px">
                <h2 style="margin: 0 0 16px; font-size: 20px; color: #111111">
                  Votre commande a été livrée
                </h2>
                <p style="color: #555555; font-size: 15px; line-height: 1.6">
                  Votre commande
                  <strong th:text="'#' + ${orderNumber}"></strong> a bien été
                  livrée. Nous espérons qu'elle vous plaira.
                </p>
                <p style="color: #666666; font-size: 13px; line-height: 1.6">
                  Vous disposez de 14 jours à compter de la réception pour
                  exercer votre droit de rétractation. Pour toute question,
                  répondez simplement à cet email.
                </p>
                <p style="margin: 28px 0">
                  <a
                    th:href="${shopUrl}"
                    style="
                      background: #111111;
                      color: #ffffff;
                      padding: 12px 24px;
                      text-decoration: none;
                      border-radius: 4px;
                      font-size: 14px;
                      display: inline-block;
                    "
                  >
                    Découvrir la boutique
                  </a>
                </p>
              </td>
            </tr>
            <tr>
              <td th:replace="~{mail/fragments :: footer}"></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
